<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Posts — Vārtā</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/thread.css">
  <style>
    .posts-page { padding: 100px 2rem 4rem; max-width: 820px; margin: 0 auto; }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; font-weight: 700; color: var(--navy); margin-bottom: 0.3rem;
    }
    .page-sub { font-size: 0.88rem; color: var(--muted); font-style: italic; margin-bottom: 2rem; }
    .post-paper-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem; color: var(--amber); letter-spacing: 0.08em;
      margin-bottom: 0.6rem; cursor: pointer; display: inline-block;
    }
    .post-paper-link:hover { text-decoration: underline; }
    .unsave-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 0.3rem 0.7rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
      border-radius: 2px; cursor: pointer; transition: all 0.2s;
    }
    .unsave-btn:hover { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

  <nav>
    <div class="nav-brand" onclick="window.location.href='index.html'">
      <span class="nav-brand-dev">वार्ता</span>
      <span class="nav-brand-lat">Vārtā</span>
    </div>
    <div class="nav-right" id="nav-right">
      <button class="btn-nav" onclick="openAuth('login')">Sign In</button>
      <button class="btn-nav btn-nav-filled" onclick="openAuth('signup')">Join Free</button>
    </div>
  </nav>

  <!-- Auth modal (minimal) -->
  <div class="modal-overlay" id="auth-modal" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title"><span>वार्ता</span> Vārtā</div>
        <button class="modal-close" onclick="closeAuth()">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-tabs">
          <button class="mtab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
          <button class="mtab" id="tab-signup" onclick="switchAuthTab('signup')">Create Account</button>
        </div>
        <div id="login-form">
          <div class="form-group"><label class="form-label">Email</label>
            <input type="email" class="form-input" id="login-email"></div>
          <div class="form-group"><label class="form-label">Password</label>
            <input type="password" class="form-input" id="login-pass"></div>
          <button class="btn-full" onclick="doLogin()">Sign In →</button>
        </div>
        <div id="signup-form" style="display:none;">
          <div class="field-row">
            <div class="form-group"><label class="form-label">First Name</label>
              <input type="text" class="form-input" id="su-fname"></div>
            <div class="form-group"><label class="form-label">Last Name</label>
              <input type="text" class="form-input" id="su-lname"></div>
          </div>
          <div class="form-group"><label class="form-label">Email</label>
            <input type="email" class="form-input" id="su-email"></div>
          <div class="form-group"><label class="form-label">Role</label>
            <select class="role-select" id="su-role">
              <option>PhD Candidate</option><option>Postdoctoral Researcher</option>
              <option>Assistant Professor</option><option>Associate Professor</option>
              <option>Full Professor</option><option>Research Scientist (Industry)</option>
              <option>Independent Researcher</option>
            </select></div>
          <div class="form-group"><label class="form-label">Institution</label>
            <input type="text" class="form-input" id="su-inst"></div>
          <div class="form-group"><label class="form-label">Password</label>
            <input type="password" class="form-input" id="su-pass"></div>
          <button class="btn-full" onclick="doSignup()">Create Account →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="posts-page">
    <div class="page-title">Saved Posts</div>
    <div class="page-sub">Posts you've bookmarked for later reference</div>
    <div id="saved-container">
      <div class="empty-thread">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Loading saved posts…</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await new Promise(r => setTimeout(r, 300));
      if (!currentUser) {
        document.getElementById('saved-container').innerHTML = `
          <div class="empty-thread">
            <div class="empty-icon">🔒</div>
            <div class="empty-title">Sign in to see saved posts</div>
          </div>`;
        return;
      }
      loadSavedPosts();
    });

    async function loadSavedPosts() {
      const { data, error } = await sb
        .from('saved_posts')
        .select('post_id, created_at, posts(id, html, outcome, author, affil, vote_count, doi, papers(title))')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error || !data?.length) {
        document.getElementById('saved-container').innerHTML = `
          <div class="empty-thread">
            <div class="empty-icon">🔖</div>
            <div class="empty-title">No saved posts yet</div>
            <div class="empty-desc">Click the 🔖 Save button on any post to bookmark it here.</div>
          </div>`;
        return;
      }

      const tagMap = {
        replicated: ['tr','Replicated'], partial: ['tp','Partial'],
        failed: ['tf','Failed'], discussion: ['td','Discussion']
      };

      document.getElementById('saved-container').innerHTML = data.map(row => {
        const p = row.posts;
        if (!p) return '';
        const [tc, tl] = tagMap[p.outcome] || ['td','Discussion'];
        const savedDate = new Date(row.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
        return `
          <div class="post" id="saved-${p.id}">
            <div class="post-paper-link"
              onclick="window.location.href='thread.html?doi=${encodeURIComponent(p.doi)}'">
              ↗ ${p.papers?.title || p.doi}
            </div>
            <div class="post-hdr">
              <div class="pa-row">
                <div class="avatar avn">${p.author?.[0]?.toUpperCase() || '?'}</div>
                <div>
                  <div class="author-name">${p.author}</div>
                  <div class="author-affil">${p.affil || ''}</div>
                </div>
              </div>
              <div class="post-meta-r">
                <span class="otag ${tc}">${tl}</span>
                <span class="pdate">Saved ${savedDate}</span>
              </div>
            </div>
            <div class="post-body">${p.html}</div>
            <div class="post-footer">
              <span style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted);">
                ▲ ${p.vote_count || 0} votes
              </span>
              <button class="action-btn"
                onclick="window.location.href='thread.html?doi=${encodeURIComponent(p.doi)}'">
                View Thread →
              </button>
              <button class="unsave-btn" onclick="unsavePost(${p.id})">✕ Remove</button>
            </div>
          </div>`;
      }).join('');
    }

    async function unsavePost(postId) {
      const { error } = await sb
        .from('saved_posts')
        .delete()
        .eq('user_id', currentUser.id)
        .eq('post_id', postId);

      if (error) { showToast('Error: ' + error.message); return; }
      document.getElementById('saved-' + postId)?.remove();
      showToast('Post removed from saved.');
    }
  </script>
</body>
</html>
